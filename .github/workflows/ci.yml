name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo nextest run --profile ci
        continue-on-error: true

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Run benchmark
        # target/criterion is wiped first: it can survive from a previous
        # run via the cargo cache, and criterion's own "compare vs. last
        # run" logic errors loudly if that leftover baseline is partial —
        # github-action-benchmark is the real source of cross-run history
        # now, so criterion doesn't need its own baseline here at all.
        run: |
          rm -rf target/criterion
          cargo bench --bench scan_benchmark --bench search_benchmark -- --output-format bencher | tee bench-output.txt

      - name: Track benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Only main's own history is durable — PR runs (including from
          # forks, which get a read-only token anyway) compare against it
          # and can comment on a regression, but don't get to rewrite it.
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: false
          summary-always: true

      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: target/criterion
