name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Set version from release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = /s/^version = \".*\"/version = \"$version\"/" Cargo.toml

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package tarball
        run: |
          strip target/release/costree
          mkdir -p dist
          tar -czf dist/costree-linux-x86_64.tar.gz -C target/release costree

      - name: Build .deb package
        run: cargo deb --no-build --output dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/costree-linux-x86_64.tar.gz
            dist/*.deb
