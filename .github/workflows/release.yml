name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package
        run: |
          strip target/release/costree
          mkdir -p dist
          tar -czf dist/costree-linux-x86_64.tar.gz -C target/release costree

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/costree-linux-x86_64.tar.gz
