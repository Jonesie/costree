[package]
name = "costree"
version = "0.1.0"
edition = "2021"
description = "A graphical disk usage analyzer for the COSMIC desktop"
license = "MIT"
repository = "https://github.com/Jonesie/costree"
keywords = ["disk-usage", "cosmic", "gui"]
categories = ["filesystem", "gui"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
# Pinned to the 2.x line explicitly: bincode 3.0.0 on crates.io is a
# deliberately broken protest release (a bare `compile_error!` pointing at
# https://xkcd.com/2347/) — "2" keeps the resolver from ever landing on it.
bincode = { version = "2", features = ["serde"] }
regex = "1"
libc = "0.2"
rayon = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "wgpu",
    "tokio",
    "single-instance",
    "xdg-portal",
]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scan_benchmark"
harness = false

[[bench]]
name = "search_benchmark"
harness = false

[package.metadata.deb]
maintainer = "Jonesie <peter@jonesie.net.nz>"
copyright = "2026, Jonesie"
license-file = ["LICENSE", "4"]
extended-description = """\
CosTree scans a directory tree and shows file/folder sizes, with
incremental scanning, search/filtering, and file operations (open,
rename, delete) — built with libcosmic for the COSMIC desktop."""
depends = "$auto"
section = "utils"
priority = "optional"
maintainer-scripts = "packaging/deb-scripts"
assets = [
    ["target/release/costree", "usr/bin/", "755"],
    ["packaging/net.jonesie.Costree.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/net.jonesie.Costree.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/net.jonesie.Costree.metainfo.xml", "usr/share/metainfo/", "644"],
]
